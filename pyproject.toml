[project]
name = "legalrag"
version = "0.1.0"
description = "Retrieval-augmented QA over French public-service legal guides, with a measured evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.110",
    "httpx>=0.27",
    "lxml>=5.0",
    "numpy>=1.26",
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.44", "tqdm>=4.66"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
legalrag = "legalrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legalrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# B008: typer.Option in defaults is the idiomatic Typer pattern
# DTZ005: local timestamps are only used for run file names
# SIM905: the stopword list reads better as a split string
ignore = ["B008", "DTZ005", "SIM905"]
